name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN permissions needed to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a new push finishes queued, not cancelled mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build production bundle
    runs-on: ubuntu-latest
    env:
      # All commercial configuration is public build-time data — never secrets.
      VITE_APP_URL: https://kelvin1586.github.io/filetools
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Optional overrides — set in repo Settings → Secrets and variables →
          # Actions → Variables. Never put private provider secrets here.
          VITE_UPGRADE_URL: ${{ vars.VITE_UPGRADE_URL }}
          VITE_PREMIUM_PRICE: ${{ vars.VITE_PREMIUM_PRICE }}
          VITE_PREMIUM_CURRENCY: ${{ vars.VITE_PREMIUM_CURRENCY }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Enables Pages with "GitHub Actions" as source on first run.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
